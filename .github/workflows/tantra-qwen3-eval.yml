name: Tantra Qwen3-1.7B multilingual baseline

on:
  workflow_dispatch:
    inputs:
      max_new_tokens:
        description: Maximum generated tokens per prompt
        required: false
        default: "96"

permissions:
  contents: read

jobs:
  qwen3-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install pretrained runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pretrained,test]"
      - name: Download pinned Qwen3 checkpoint
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="Qwen/Qwen3-1.7B",
              revision="44c895567ee7eca2993a98be9664adf7245aa1ee",
              local_dir="checkpoints/Qwen3-1.7B",
          )
          PY
      - name: Run frozen Tantra multilingual baseline suite
        run: |
          python -m Tantra.pretrained_benchmark             --model-id Qwen/Qwen3-1.7B             --checkpoint checkpoints/Qwen3-1.7B             --suite Tests/fixtures/pretrained_benchmark.jsonl             --output runs/benchmarks/qwen3-1.7b-base.json             --device cpu --max-new-tokens "${{ inputs.max_new_tokens }}"
      - name: Upload baseline report
        uses: actions/upload-artifact@v4
        with:
          name: tantra-qwen3-1.7b-baseline
          path: runs/benchmarks/qwen3-1.7b-base.json
          if-no-files-found: error
          retention-days: 30
