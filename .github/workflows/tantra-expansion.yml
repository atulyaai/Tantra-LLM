name: Tantra expansion and regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 · full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Compile Python sources
        run: python -m compileall -q Tantra Tests
      - name: Validate architecture assets
        run: python -c "import json, xml.etree.ElementTree as ET; json.load(open('configs/research/pretrained-expansion.json', encoding='utf-8')); ET.parse('Assets/tantra_pretrained_architecture.svg')"
      - name: Run complete test suite
        run: python -m pytest Tests -q
