name: Tantra pretrained checkpoint smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and pretrained runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e ".[pretrained,test]"
      - name: Download the pinned checkpoint
        run: |
          hf download HuggingFaceTB/SmolLM2-360M-Instruct \
            --revision c38281e01d0c0b0c36eac2f5bcb5b51fa2e803fc \
            --local-dir "$RUNNER_TEMP/smollm2-360m"
      - name: Run local gateway smoke
        run: |
          python -m Tantra.pretrained_cli smoke \
            --model-id HuggingFaceTB/SmolLM2-360M-Instruct \
            --checkpoint "$RUNNER_TEMP/smollm2-360m" \
            --device cpu --max-new-tokens 48
