name: Tantra pretrained checkpoint smoke test

on:
  pull_request:
    paths:
      - "Tantra/model_registry.py"
      - "Tantra/model_gateway.py"
      - "Tantra/pretrained_cli.py"
      - "Tantra/pretrained_expansion.py"
      - "Tantra/model_lifecycle.py"
      - "Tests/test_model_gateway.py"
      - "Tests/test_pretrained_expansion.py"
      - "Tests/fixtures/pretrained_lora_smoke.jsonl"
      - "Tests/fixtures/pretrained_replay_smoke.jsonl"
      - "Tantra/pretrained_expansion.py"
      - "configs/models/registry.json"
      - "pyproject.toml"
      - ".github/workflows/tantra-pretrained-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretrained-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install pretrained runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[finetune,test]"
      - name: Download pinned upstream snapshot
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="HuggingFaceTB/SmolLM2-360M-Instruct",
              revision="c38281e01d0c0b0c36eac2f5bcb5b51fa2e803fc",
              local_dir="checkpoints/SmolLM2-360M-Instruct",
          )
          PY
      - name: Run one-step real LoRA adaptation smoke
        run: |
          python -m Tantra.pretrained_cli train-lora \
            --model-id HuggingFaceTB/SmolLM2-360M-Instruct \
            --checkpoint checkpoints/SmolLM2-360M-Instruct \
            --candidate-id ci-smollm-lora \
            --data Tests/fixtures/pretrained_lora_smoke.jsonl \
            --output "$RUNNER_TEMP/ci-smollm-lora" --steps 1 --rank 2 \
            --replay-data Tests/fixtures/pretrained_replay_smoke.jsonl --replay-ratio 0.25
      - name: Run local-only model generation with the LoRA adapter
        run: |
          python -m Tantra.pretrained_cli smoke \
            --model-id HuggingFaceTB/SmolLM2-360M-Instruct \
            --checkpoint checkpoints/SmolLM2-360M-Instruct \
            --adapter "$RUNNER_TEMP/ci-smollm-lora" \
            --device cpu --max-new-tokens 24
      - name: Train and reload one residual-growth branch
        run: |
          python -m Tantra.pretrained_cli grow-residual \
            --model-id HuggingFaceTB/SmolLM2-360M-Instruct \
            --checkpoint checkpoints/SmolLM2-360M-Instruct \
            --candidate-id ci-smollm-residual \
            --data Tests/fixtures/pretrained_lora_smoke.jsonl \
            --output "$RUNNER_TEMP/ci-smollm-residual" \
            --steps 1 --bottleneck 8
          python -m Tantra.pretrained_cli smoke \
            --model-id HuggingFaceTB/SmolLM2-360M-Instruct \
            --checkpoint checkpoints/SmolLM2-360M-Instruct \
            --residual-candidate "$RUNNER_TEMP/ci-smollm-residual" \
            --device cpu --max-new-tokens 24
