name: Tantra pretrained checkpoint smoke test

on:
  pull_request:
    paths:
      - "Tantra/model_registry.py"
      - "Tantra/model_gateway.py"
      - "Tantra/pretrained_cli.py"
      - "configs/models/registry.json"
      - "pyproject.toml"
      - ".github/workflows/tantra-pretrained-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretrained-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install pretrained runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pretrained,test]"
      - name: Download pinned upstream snapshot
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="HuggingFaceTB/SmolLM2-360M-Instruct",
              revision="c38281e01d0c0b0c36eac2f5bcb5b51fa2e803fc",
              local_dir="checkpoints/SmolLM2-360M-Instruct",
          )
          PY
      - name: Run local-only model generation smoke test
        run: |
          python -m Tantra.pretrained_cli smoke \
            --model-id HuggingFaceTB/SmolLM2-360M-Instruct \
            --checkpoint checkpoints/SmolLM2-360M-Instruct \
            --device cpu --max-new-tokens 24
