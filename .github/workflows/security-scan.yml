name: Security & Vulnerability Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1' # Weekly security audit

jobs:
  security-audit:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit safety pytest

      - name: Static Security Analysis (Bandit)
        run: |
          bandit -r Tantra webui -ll -ii -x Tests/ --exit-zero

      - name: Dependency Vulnerability Audit (Safety)
        run: |
          safety check --full-report || true

      - name: Run Red-Teaming & Security Test Suite
        run: |
          pytest Tests/test_robustness.py -v
