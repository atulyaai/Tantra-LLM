[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tantra-llm"
version = "0.3.0"
description = "Multilingual language model fine-tuning and evaluation built around Qwen3.5"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Atulya AI", email = "contact@atulvij.com" }]
keywords = ["llm", "qwen3.5", "multilingual", "hindi", "hinglish", "fine-tuning", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core (training + chat), WebUI, streaming ingestion, live terminal
dependencies = [
    "torch>=2.2",
    "tokenizers>=0.19",
    "numpy>=1.26",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pyarrow>=17,<24",
    "rich>=13,<15",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
pretrained = ["transformers>=4.51,<5", "accelerate>=0.34", "safetensors>=0.4"]
finetune = ["torch>=2.7", "transformers>=5.23,<6", "peft>=0.19.1,<1", "accelerate>=1.0", "safetensors>=0.4"]

[project.urls]
Homepage = "https://www.atulvij.com"
Repository = "https://github.com/atulyaai/Tantra-LLM"

# Optional, offline speech (open-source models, downloaded once on first use):
#   pip install openai-whisper          speech-to-text (MIT)   -- needs ffmpeg on PATH
#   pip install kokoro soundfile        text-to-speech (Apache-2.0)

[tool.pytest.ini_options]
testpaths = ["Tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
include = ["Tantra*"]
exclude = ["Tests*", "Model*", "Assets*", "examples*"]
