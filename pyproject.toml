[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tantra-llm"
version = "0.3.0"
description = "Hindi-first language model built from scratch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Atulya AI", email = "contact@atulvij.com" }]
keywords = ["llm", "hindi", "nlp", "transformer", "india", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://www.atulvij.com"
Repository = "https://github.com/atulyaai/Tantra-LLM"
