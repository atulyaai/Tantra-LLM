<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Tantra native-first expandable intelligence architecture</title>
<desc id="desc">Native Tantra foundation with compatible experts, residual growth, optional external teachers, hybrid knowledge, and evaluation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d2940"/></linearGradient>
  <style>
    .h{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#cbd5e1}
    .box{rx:18;stroke-width:2}.t{font:700 20px Arial,sans-serif;fill:#fff}.s{font:15px Arial,sans-serif;fill:#e2e8f0}
    .line{stroke:#94a3b8;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1200" height="920" rx="24" fill="url(#bg)"/>
<text x="600" y="58" text-anchor="middle" class="h">TANTRA · NATIVE-FIRST EXPANDABLE INTELLIGENCE</text>
<text x="600" y="88" text-anchor="middle" class="sub">Independent native weights · compatible experts · controlled growth</text>
<rect x="250" y="120" width="700" height="100" class="box" fill="#253a5c" stroke="#60a5fa"/>
<text x="600" y="160" text-anchor="middle" class="t">Tantra identity &amp; native orchestration core</text>
<text x="600" y="190" text-anchor="middle" class="s">Native model family · stable interfaces · routing · evaluation · rollback</text>
<path d="M600 220 V260 M180 260 H1020 M180 260 V295 M440 260 V295 M760 260 V295 M1020 260 V295" class="line"/>
<rect x="55" y="295" width="250" height="145" class="box" fill="#17456a" stroke="#38bdf8"/>
<text x="180" y="335" text-anchor="middle" class="t">Native foundation</text>
<text x="180" y="368" text-anchor="middle" class="s">Tantra-owned architecture + weights</text>
<text x="180" y="394" text-anchor="middle" class="s">Tokenizer + training lineage</text>
<text x="180" y="420" text-anchor="middle" class="s">Reproducible native training</text>
<rect x="315" y="295" width="250" height="145" class="box" fill="#145044" stroke="#34d399"/>
<text x="440" y="335" text-anchor="middle" class="t">Native expert A + B</text>
<text x="440" y="368" text-anchor="middle" class="s">Shared hidden-state contract</text>
<text x="440" y="394" text-anchor="middle" class="s">Reasoning + coding specialists</text>
<text x="440" y="420" text-anchor="middle" class="s">Versioned expert interfaces</text>
<rect x="635" y="295" width="250" height="145" class="box" fill="#49366b" stroke="#c4b5fd"/>
<text x="760" y="335" text-anchor="middle" class="t">Expandable residual expert</text>
<text x="760" y="368" text-anchor="middle" class="s">Preserved original expert</text>
<text x="760" y="394" text-anchor="middle" class="s">New gated residual branch</text>
<text x="760" y="420" text-anchor="middle" class="s">Distillation + replay + new training</text>
<rect x="895" y="295" width="250" height="145" class="box" fill="#62401f" stroke="#fbbf24"/>
<text x="1020" y="335" text-anchor="middle" class="t">Optional external models</text>
<text x="1020" y="368" text-anchor="middle" class="s">Teacher / benchmark only</text>
<text x="1020" y="394" text-anchor="middle" class="s">Separate weights + provenance</text>
<text x="1020" y="420" text-anchor="middle" class="s">Never the native foundation</text>
<path d="M180 440 V490 H600 V520 M440 440 V490 M760 440 V490 M1020 440 V490 H600" class="line"/>
<rect x="170" y="520" width="860" height="110" class="box" fill="#3b3650" stroke="#a78bfa"/>
<text x="600" y="560" text-anchor="middle" class="t">Hybrid knowledge and action layer</text>
<text x="600" y="592" text-anchor="middle" class="s">Parametric weights · retrieval / long-term memory · tools / APIs</text>
<path d="M600 630 V680" class="line"/>
<rect x="170" y="680" width="860" height="115" class="box" fill="#164e3d" stroke="#34d399"/>
<text x="600" y="720" text-anchor="middle" class="t">Native learning, evaluation and promotion controller</text>
<text x="600" y="752" text-anchor="middle" class="s">Distillation + replay · regression gates · shadow routing · rollback</text>
<text x="600" y="778" text-anchor="middle" class="s">Residual branches first · width/depth later</text>
<text x="600" y="860" text-anchor="middle" class="sub">Native Tantra weights are independently trained; external teacher provenance remains separate and traceable.</text>
</svg>