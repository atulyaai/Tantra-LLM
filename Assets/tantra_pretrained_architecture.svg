<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Tantra pretrained-first expandable intelligence architecture</title>
<desc id="desc">Tantra orchestration and identity over pretrained foundations, adapted experts, inherited experts, independent specialists, hybrid knowledge, and evaluation.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1d2940"/></linearGradient>
  <style>
    .h{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:16px Arial,sans-serif;fill:#cbd5e1}
    .box{rx:18;stroke-width:2}.t{font:700 20px Arial,sans-serif;fill:#fff}.s{font:15px Arial,sans-serif;fill:#e2e8f0}
    .line{stroke:#94a3b8;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1200" height="920" rx="24" fill="url(#bg)"/>
<text x="600" y="58" text-anchor="middle" class="h">TANTRA · PRETRAINED-FIRST INTELLIGENCE</text>
<text x="600" y="88" text-anchor="middle" class="sub">One platform identity · multiple model families · controlled expansion</text>
<rect x="250" y="120" width="700" height="100" class="box" fill="#253a5c" stroke="#60a5fa"/>
<text x="600" y="160" text-anchor="middle" class="t">Tantra identity &amp; orchestration core</text>
<text x="600" y="190" text-anchor="middle" class="s">Task planning · context · dynamic routing · compute budgets · verification</text>
<path d="M600 220 V260 M180 260 H1020 M180 260 V295 M440 260 V295 M760 260 V295 M1020 260 V295" class="line"/>
<rect x="55" y="295" width="250" height="145" class="box" fill="#17456a" stroke="#38bdf8"/>
<text x="180" y="335" text-anchor="middle" class="t">Pretrained foundations</text>
<text x="180" y="368" text-anchor="middle" class="s">Versioned source weights</text>
<text x="180" y="394" text-anchor="middle" class="s">Licence + provenance gate</text>
<text x="180" y="420" text-anchor="middle" class="s">LoRA / adapter / SFT</text>
<rect x="315" y="295" width="250" height="145" class="box" fill="#145044" stroke="#34d399"/>
<text x="440" y="335" text-anchor="middle" class="t">Neural expert modules</text>
<text x="440" y="368" text-anchor="middle" class="s">Compatible hidden-state blocks</text>
<text x="440" y="394" text-anchor="middle" class="s">Sparse MoE integration</text>
<text x="440" y="420" text-anchor="middle" class="s">Adapters + router training</text>
<rect x="635" y="295" width="250" height="145" class="box" fill="#49366b" stroke="#c4b5fd"/>
<text x="760" y="335" text-anchor="middle" class="t">Inherited specialists</text>
<text x="760" y="368" text-anchor="middle" class="s">Adapter / weight transfer</text>
<text x="760" y="394" text-anchor="middle" class="s">Behaviour / feature distillation</text>
<text x="760" y="420" text-anchor="middle" class="s">Selective capability inheritance</text>
<rect x="895" y="295" width="250" height="145" class="box" fill="#62401f" stroke="#fbbf24"/>
<text x="1020" y="335" text-anchor="middle" class="t">Specialist models</text>
<text x="1020" y="368" text-anchor="middle" class="s">Independent model services</text>
<text x="1020" y="394" text-anchor="middle" class="s">Model gateway + typed I/O</text>
<text x="1020" y="420" text-anchor="middle" class="s">Timeout + fallback</text>
<path d="M180 440 V490 H600 V520 M440 440 V490 M760 440 V490 M1020 440 V490 H600" class="line"/>
<rect x="170" y="520" width="860" height="110" class="box" fill="#3b3650" stroke="#a78bfa"/>
<text x="600" y="560" text-anchor="middle" class="t">Hybrid knowledge and action layer</text>
<text x="600" y="592" text-anchor="middle" class="s">Parametric weights · retrieval / long-term memory · tools / APIs</text>
<path d="M600 630 V680" class="line"/>
<rect x="170" y="680" width="860" height="115" class="box" fill="#164e3d" stroke="#34d399"/>
<text x="600" y="720" text-anchor="middle" class="t">Learning, evaluation and promotion controller</text>
<text x="600" y="752" text-anchor="middle" class="s">Distillation + replay + new training · tests · shadow routing · rollback</text>
<text x="600" y="778" text-anchor="middle" class="s">Width growth · depth growth · residual-branch growth</text>
<text x="600" y="860" text-anchor="middle" class="sub">All backends identify as Tantra; underlying model provenance remains truthful and traceable.</text>
</svg>